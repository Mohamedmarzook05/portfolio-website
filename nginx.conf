# ═══════════════════════════════════════════════════════════
#  Nginx configuration for Mohamed Marzook's Portfolio
#  Place this in: /etc/nginx/sites-available/portfolio
#  Then: sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#  And:  sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or EC2 public IP
    server_name your-domain.com www.your-domain.com;

    # Path where the portfolio files live on the server
    root /var/www/portfolio;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
